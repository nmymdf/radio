name: Build Car Home APK
on:
  push:
    branches: [ main ]
    paths: [ 'carhome/**', '.github/workflows/carhome.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carhome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          set -o pipefail
          VER=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p ../out
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee ../build-log.txt
          cp app/build/outputs/apk/release/app-release.apk "../out/carhome-v${VER}.apk"
          ls -la ../out | tee -a ../build-log.txt
      - name: Publish APK to release and apk-car branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          gh release delete carhome-latest -y --cleanup-tag || true
          gh release create carhome-latest ../out/*.apk --title "車機桌面" --notes "build ${GITHUB_SHA}" --target "${GITHUB_SHA}"
          mkdir ../branch && cd ../branch && git init -q && git checkout -q -b apk-car
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "build ${GITHUB_SHA}" > BUILD.txt
          echo "carhome-v${VER}.apk" > RELEASE.txt
          git add . && git commit -qm "Car Home APK v${VER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-car
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir ../logout && tail -c 200000 ../build-log.txt > ../logout/build-log.txt || true
          cd ../logout && git init -q && git checkout -q -b log-car
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "build ${GITHUB_SHA}" > BUILD.txt
          git add . && git commit -qm "log" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" log-car
