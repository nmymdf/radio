name: Build APK
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build-log.txt; exit ${PIPESTATUS[0]}
      - name: Publish APK to apk branch
        if: success()
        run: |
          VER=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir out && cp app/build/outputs/apk/release/app-release.apk "out/radio-v${VER}.apk"
          cd out && git init -q && git checkout -q -b apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "build ${GITHUB_SHA}" > BUILD.txt
          git add . && git commit -qm "APK v${VER}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir logout && tail -c 200000 build-log.txt > logout/build-log.txt || true
          cd logout && git init -q && git checkout -q -b log
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "build ${GITHUB_SHA}" > BUILD.txt
          git add . && git commit -qm "log" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" log
