name: Build Desktop EXE
on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop.yml' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: |
          npm install --no-audit --no-fund 2>&1 | tee ../build-log.txt
          npx electron-builder --win portable --x64 --publish never 2>&1 | tee -a ../build-log.txt
          ls dist
          test -f dist/radio-desktop-v*.exe
      - name: Publish EXE to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist/*.exe | tee -a ../build-log.txt
          gh release delete desktop-latest -y --cleanup-tag 2>&1 | tee -a ../build-log.txt || true
          gh release create desktop-latest dist/radio-desktop-v*.exe --title "網路收音機 電腦版" --notes "build ${GITHUB_SHA}" --target "${GITHUB_SHA}" 2>&1 | tee -a ../build-log.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir ../logout && cp ../build-log.txt ../logout/ || echo none > ../logout/build-log.txt
          cd ../logout && git init -q && git checkout -q -b log-desktop
          git config user.name "github-actions" && git config user.email "actions@github.com"
          echo "build ${GITHUB_SHA}" > BUILD.txt
          git add . && git commit -qm "log" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" log-desktop
